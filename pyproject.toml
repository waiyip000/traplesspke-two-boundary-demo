[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traplesspke-two-boundary-demo"
version = "0.1.2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "COPYRIGHT.txt"]
description = "Inspectable two-candidate TraplessPKE reference demonstration"
requires-python = ">=3.12,<3.13"
authors = [{name = "Wai Yip, WONG"}]
dependencies = ["pqcrypto==0.3.4", "cryptography==50.0.1"]

[project.optional-dependencies]
gpu-examples = ["pyopencl==2026.1.4"]

[project.scripts]
trapless-demo = "traplesspke_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
